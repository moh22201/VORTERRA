<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090806">
  <meta name="description" content="VORTERRA — Build, Manage, Grow.">
  <title>VORTERRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="intro" class="intro-screen" aria-label="VORTERRA introduction">
      <div class="ambient ambient-gold"></div>
      <div class="ambient ambient-blue"></div>
      <div class="grid-glow"></div>
      <div id="particles" class="particles" aria-hidden="true"></div>
      <div class="intro-content">
        <div class="emblem" aria-hidden="true">
          <span class="emblem-orbit orbit-one"></span>
          <span class="emblem-orbit orbit-two"></span>
          <span class="emblem-core">V</span>
        </div>
        <p class="eyebrow">A WORLD OF INDUSTRY & OPPORTUNITY</p>
        <h1 class="wordmark">VORTERRA</h1>
        <div class="wordmark-line"></div>
        <p class="tagline">BUILD <i>•</i> MANAGE <i>•</i> GROW</p>
        <button id="enter-button" class="enter-button" type="button">
          <span>ENTER THE WORLD</span><b aria-hidden="true">↗</b>
        </button>
      </div>
      <div class="intro-footer"><span>VORTERRA NETWORK</span><span>EST. 2026</span></div>
      <div class="skip-hint">A NEW ECONOMIC WORLD</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
